<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <!-- Top Face Gradients (Bottom to Top) -->
    <linearGradient id="topWhite" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dce3ec"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="topRed" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="topBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <linearGradient id="topYellow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>
    <linearGradient id="topOrange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="topGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>

    <!-- Left Face Gradients (Top-Left to Bottom-Right) -->
    <linearGradient id="leftWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="leftRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="leftGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="leftYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
    <linearGradient id="leftOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="leftBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>

    <!-- Right Face Gradients (Top to Bottom) -->
    <linearGradient id="rightWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rightRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff451a"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="rightGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="rightYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="rightOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="rightBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>

  <!-- Base 3D Isometric Black Cube Shell -->
  <polygon points="24,24 41.32,14 24,4 6.68,14" fill="#18181f" stroke="#101014" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="24,24 6.68,14 6.68,34 24,44" fill="#111116" stroke="#0b0b0e" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="24,24 41.32,14 41.32,34 24,44" fill="#0c0c10" stroke="#08080a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Top 9 Stickers -->
  <polygon points="24.00,23.30 19.44,20.67 24.00,18.03 28.56,20.67" fill="url(#topRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="29.77,19.97 25.21,17.33 29.77,14.70 34.33,17.33" fill="url(#topBlue)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="35.55,16.63 30.99,14.00 35.55,11.37 40.11,14.00" fill="url(#topBlue)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="18.23,19.97 13.67,17.33 18.23,14.70 22.79,17.33" fill="url(#topRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="24.00,16.63 19.44,14.00 24.00,11.37 28.56,14.00" fill="url(#topWhite)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="29.77,13.30 25.21,10.67 29.77,8.03 34.33,10.67" fill="url(#topBlue)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="12.45,16.63 7.89,14.00 12.45,11.37 17.01,14.00" fill="url(#topYellow)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="18.23,13.30 13.67,10.67 18.23,8.03 22.79,10.67" fill="url(#topWhite)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="24.00,9.97 19.44,7.33 24.00,4.70 28.56,7.33" fill="url(#topWhite)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Left 9 Stickers -->
  <polygon points="23.39,24.35 18.83,21.72 18.83,26.98 23.39,29.62" fill="url(#leftYellow)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="23.39,31.02 18.83,28.38 18.83,33.65 23.39,36.28" fill="url(#leftOrange)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="23.39,37.68 18.83,35.05 18.83,40.32 23.39,42.95" fill="url(#leftWhite)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="17.62,21.02 13.06,18.38 13.06,23.65 17.62,26.28" fill="url(#leftWhite)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="17.62,27.68 13.06,25.05 13.06,30.32 17.62,32.95" fill="url(#leftGreen)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="17.62,34.35 13.06,31.72 13.06,36.98 17.62,39.62" fill="url(#leftRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="11.85,17.68 7.29,15.05 7.29,20.32 11.85,22.95" fill="url(#leftOrange)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="11.85,24.35 7.29,21.72 7.29,26.98 11.85,29.62" fill="url(#leftBlue)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="11.85,31.02 7.29,28.38 7.29,33.65 11.85,36.28" fill="url(#leftOrange)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Right 9 Stickers -->
  <polygon points="24.61,24.35 29.17,21.72 29.17,26.98 24.61,29.62" fill="url(#rightBlue)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="24.61,31.02 29.17,28.38 29.17,33.65 24.61,36.28" fill="url(#rightYellow)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="24.61,37.68 29.17,35.05 29.17,40.32 24.61,42.95" fill="url(#rightRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="30.38,21.02 34.94,18.38 34.94,23.65 30.38,26.28" fill="url(#rightRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="30.38,27.68 34.94,25.05 34.94,30.32 30.38,32.95" fill="url(#rightRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="30.38,34.35 34.94,31.72 34.94,36.98 30.38,39.62" fill="url(#rightGreen)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="36.15,17.68 40.71,15.05 40.71,20.32 36.15,22.95" fill="url(#rightOrange)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="36.15,24.35 40.71,21.72 40.71,26.98 36.15,29.62" fill="url(#rightRed)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="36.15,31.02 40.71,28.38 40.71,33.65 36.15,36.28" fill="url(#rightWhite)" stroke="#1a1a20" stroke-width="0.6" stroke-linejoin="round"/>
</svg>
